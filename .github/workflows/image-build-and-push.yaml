name: Docker Build and Push

# `prereleased` -> staging image; `released` -> prod image (fires for a new full
# release and when a pre-release is promoted to a full release).
on:
  release:
    types:
      - prereleased
      - released

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Get version and deployment env
        env:
          TAG: ${{ github.event.release.tag_name }}
          ACTION: ${{ github.event.action }}
        run: |
          if [[ $ACTION == "released" ]]; then
            DEPLOYMENT="prod"
          else
            DEPLOYMENT="staging"
          fi
          {
            echo "tag=$TAG"
            echo "version=${TAG#v}"
            echo "commit=$(git rev-parse HEAD)"
            echo "deployment=$DEPLOYMENT"
          } >> "$GITHUB_ENV"

      # Prod images must come from a SemVer tag on main that is higher than every
      # earlier release, so latest-prod never moves back to an older version.
      - name: Validate release tag
        if: env.deployment == 'prod'
        run: |
          git fetch --force --tags origin main:refs/remotes/origin/main
          scripts/release.sh check "$tag"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          push: true
          build-args: |
            APP_VERSION=${{ env.tag }}
            APP_COMMIT=${{ env.commit }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.commit }}
            org.opencontainers.image.version=${{ env.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          tags: |
            ${{ env.IMAGE }}:latest-${{ env.deployment }}
            ${{ env.IMAGE }}:${{ env.version }}-${{ env.deployment }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
