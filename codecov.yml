# Coverage is reported on PRs and on pushes to main and dev, but never blocks a merge.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

# coverage.xml is written inside ai_registry/, so its paths are relative to that directory.
fixes:
  - "::ai_registry/"

comment:
  layout: "condensed_header, diff, files"
  require_changes: true
