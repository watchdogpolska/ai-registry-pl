# Reference production-like deployment.
#
# This file is intentionally infrastructure-agnostic. It is useful for testing
# the production image with MySQL 8.4, but a real deployment may use an external
# MySQL service, a different container orchestrator, and its own reverse proxy.
volumes:
  mysql-production-data:

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_polish_ci
    volumes:
      - mysql-production-data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_registry}
      MYSQL_USER: ${MYSQL_USER:-ai_registry}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  django:
    build:
      context: .
      target: production
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        APP_COMMIT: ${APP_COMMIT:-}
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
